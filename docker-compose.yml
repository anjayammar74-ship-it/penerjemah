services:
  balona:
    build: .
    restart: always
    ports:
      - "8001:8001"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: balona
      CORS_ORIGINS: "*"
      TRANSLATE_ORDER: ${TRANSLATE_ORDER:-google,libre,mymemory}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: always
    volumes:
      - balona-data:/data/db

  # Penerjemah sendiri (opsional). Nyalakan dengan: docker compose --profile lokal up -d
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["lokal"]
    restart: always
    environment:
      LT_LOAD_ONLY: en,id
    ports:
      - "5000:5000"
    volumes:
      - balona-lt:/home/libretranslate/.local

volumes:
  balona-data:
  balona-lt:
